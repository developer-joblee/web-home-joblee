<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Primary Meta Tags -->
    <title>Joblee — Profissionais de confiança ao seu alcance</title>
    <meta
      name="description"
      content="Conecte-se com profissionais confiáveis perto de você. De reparos em casa a serviços pessoais, encontre o profissional certo com a Joblee."
    />
    <meta name="author" content="Joblee" />
    <meta
      name="keywords"
      content="Joblee, profissionais, serviços, encanador, mecânico, faxineiro, personal trainer, prestadores de serviço, contratar profissional"
    />
    <!--
      canonical e robots são definidos por rota via src/components/Seo.tsx (react-helmet-async).
      Não adicionar versões estáticas aqui: o Helmet não remove tags do index.html e o Google
      trataria os canonicals duplicados/conflitantes como inválidos.
    -->

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/joblee.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joblee" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://joblee.com.br/" />
    <meta property="og:title" content="Joblee — Profissionais de confiança ao seu alcance" />
    <meta
      property="og:description"
      content="Conecte-se com profissionais confiáveis perto de você. De reparos em casa a serviços pessoais, encontre o profissional certo com a Joblee."
    />
    <meta property="og:image" content="https://joblee.com.br/joblee.png" />
    <meta property="og:image:alt" content="Joblee" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joblee — Profissionais de confiança ao seu alcance" />
    <meta
      name="twitter:description"
      content="Conecte-se com profissionais confiáveis perto de você. De reparos em casa a serviços pessoais, encontre o profissional certo com a Joblee."
    />
    <meta name="twitter:image" content="https://joblee.com.br/joblee.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Joblee",
        "url": "https://joblee.com.br/",
        "logo": "https://joblee.com.br/joblee.png",
        "description": "Plataforma que conecta pessoas a profissionais de confiança para serviços do dia a dia.",
        "email": "joblee@joblee.com.br"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
